<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Senbukan · Combate 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10091c;color:#fff1de;font:600 16px system-ui}canvas{display:block;width:100%;height:100%;touch-action:none;outline:0}#load{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:16px;background:#10091c}progress{width:240px;accent-color:#ff9c44}#error{max-width:500px;line-height:1.5;padding:24px}</style><canvas id="game" tabindex="0" aria-label="Combate 3D entre Karatê Caetano e aluno do Senbukan"></canvas><div id="load"><strong>SENBUKAN</strong><progress max="1" value="0"></progress><span>Preparando o treino…</span><div id="error" role="alert"></div></div><script src="Build/{{{ LOADER_FILENAME }}}"></script><script>

</script></html>
